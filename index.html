<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Clockify is a modern clock application featuring a real-time analog clock, stopwatch, and alarm. Enjoy a simple and intuitive time management experience.">
    <title>Clockify | Analog Clock, Stopwatch & Alarm</title>
    <link rel="icon" type="image/png" sizes="32x32" href="clock.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
        integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="main-container">
        <header>
            <nav class="nav-tabs">
                <div class="shadow"></div>
                <div class="tab clock active">World clock</div>
                <div class="tab alarm">Alarm</div>
                <div class="tab stopwatch">Stopwatch</div>
            </nav>
        </header>
        <main>
            <!-- Analog Clock section  -->
            <section class="clock-section visible">
                <div class="clock-container">
                    <div class="analog-clock">
                        <div id="hour"></div>
                        <div id="minute"></div>
                        <div id="second"></div>
                        <span style="--i:1;"><b>|</b></span>
                        <span style="--i:2;"><b>|</b></span>
                        <span style="--i:3; --num: 3;"><b>3</b></span>
                        <span style="--i:4;"><b>|</b></span>
                        <span style="--i:5;"><b>|</b></span>
                        <span style="--i:6; --num: 6;"><b>6</b></span>
                        <span style="--i:7;"><b>|</b></span>
                        <span style="--i:8;"><b>|</b></span>
                        <span style="--i:9; --num: 9;"><b>9</b></span>
                        <span style="--i:10;"><b>|</b></span>
                        <span style="--i:11;"><b>|</b></span>
                        <span style="--i:12; --num: 12;"><b>12</b></span>
                    </div>
                </div>

            </section>

            <!-- Alarm section  -->
            <section class="alarm-section">
                <h1>Alarm Section</h1>
            </section>

            <!-- Timer/Stop Watch section  -->
            <section class="timer-section">
                <h1>Timer</h1>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
